<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT Rank Overlay — StreamElements</title>
<style>
:root{--panel:rgba(12,16,24,.94);--panel2:rgba(22,29,41,.94);--line:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#a8b1c2;--red:#ff4655;--green:#71e3a2;--gold:#f5c96a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
body{display:flex;align-items:flex-start;justify-content:flex-start;padding:12px}
.overlay{width:520px;display:grid;grid-template-columns:1.1fr .9fr;gap:10px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35))}
.card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--red)}
.eyebrow{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.player{margin-top:5px;color:#d9deea;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankrow{display:flex;align-items:center;gap:12px;margin-top:8px}.rankicon{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(0,0,0,.3))}
.rankname{font-size:23px;line-height:1.05;font-weight:900;letter-spacing:-.6px}.rr{margin-top:6px;font-size:13px;color:var(--gold);font-weight:800}.delta{margin-top:5px;font-size:11px;color:var(--muted)}
.stats{display:flex;flex-direction:column;justify-content:space-between;gap:12px}.stats .card{flex:1;display:flex;flex-direction:column;justify-content:center}
.wl{display:flex;align-items:baseline;gap:8px;margin-top:7px;font-weight:900}.wins{font-size:27px;color:var(--green)}.losses{font-size:27px;color:var(--red)}.draws{color:var(--muted);font-size:14px;font-weight:700}
.sub{color:var(--muted);font-size:11px;margin-top:3px}.rrtoday{font-size:15px;font-weight:900;margin-top:6px}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--gold)}
.footer{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:0 3px;color:rgba(255,255,255,.55);font-size:9px;letter-spacing:1.2px;text-transform:uppercase}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px}.dot.off{background:var(--red)}
@media(max-width:540px){.overlay{width:calc(100vw - 24px);grid-template-columns:1fr 1fr}.rankicon{width:52px;height:52px}.rankname{font-size:18px}}
</style>
</head>
<body>
<div class="overlay">
<section class="card">
<div class="eyebrow">Competitive Rank</div><div class="player" id="player">Joselyn#gigi</div>
<div class="rankrow"><img class="rankicon" id="rankIcon" alt="" src="https://media.valorant-api.com/competitivetiers/564d8e28-c226-3180-6285-e48a390db8b1/0/largeicon.png">
<div><div class="rankname" id="rank">Loading rank…</div><div class="rr" id="rr">RR: —</div><div class="delta" id="lastDelta">Last game: —</div></div></div>
</section>
<div class="stats">
<section class="card"><div class="eyebrow">Last 24 Hours</div><div class="wl"><span class="wins" id="wins">—</span><span style="color:#8b95a7">W</span><span class="losses" id="losses">—</span><span style="color:#8b95a7">L</span><span class="draws" id="draws">— D</span></div><div class="sub" id="wr">Win rate: —</div></section>
<section class="card"><div class="eyebrow">Today's RR</div><div class="rrtoday neutral" id="rrToday">Waiting for data…</div><div class="sub" id="updated">Refreshing automatically</div></section>
</div>
<div class="footer"><span><span class="dot" id="statusDot"></span><span id="status">Connecting to API</span></span><span>VALORANT • RANK TRACKER</span></div>
</div>
<script>
/* StreamElements custom overlay: hosted as a Browser Source URL.
   If the API changes its response format, update the parsing functions below. */
const CONFIG={riotName:"Joselyn",riotTag:"gigi",region:"eu",platform:"pc",timezone:"Europe/Oslo",refreshSeconds:120};
const $=id=>document.getElementById(id), enc=s=>encodeURIComponent(s.trim());
const rankTiers=[["Iron 1",3],["Iron 2",4],["Iron 3",5],["Bronze 1",6],["Bronze 2",7],["Bronze 3",8],["Silver 1",9],["Silver 2",10],["Silver 3",11],["Gold 1",12],["Gold 2",13],["Gold 3",14],["Platinum 1",15],["Platinum 2",16],["Platinum 3",17],["Diamond 1",18],["Diamond 2",19],["Diamond 3",20],["Ascendant 1",21],["Ascendant 2",22],["Ascendant 3",23],["Immortal 1",24],["Immortal 2",25],["Immortal 3",26],["Radiant",27]];
function setStatus(msg,ok=true){$("status").textContent=msg;$("statusDot").classList.toggle("off",!ok)}
function rankIconUrl(t){const n=t.toLowerCase().replace(/\s+#.*$/,"").trim(),m=rankTiers.find(([name])=>n.startsWith(name.toLowerCase()));return `https://media.valorant-api.com/competitivetiers/564d8e28-c226-3180-6285-e48a390db8b1/${m?m[1]:0}/largeicon.png`}
// The API returns the current rank as text; the icon URL is selected from that live rank.

async function getText(url){const r=await fetch(url,{cache:"no-store"}),t=await r.text();if(!r.ok)throw Error(t||`HTTP ${r.status}`);return t.trim()}
function parseRank(t){const rr=t.match(/RR:\s*(-?\d+)\s*\((-?\d+)\)/i);let name=t.split(",")[0].trim().replace(/\s*#\d+/g,"").replace(/\s*\(🛡️.*?\)/g,"").trim();$("rank").textContent=name||"Rank unavailable";$("rr").textContent=rr?`RR: ${rr[1]}`:"RR: —";if(rr){const d=+rr[2];$("lastDelta").textContent=`Last game: ${d>0?"+":""}${d} RR`;$("lastDelta").style.color=d>0?"var(--green)":d<0?"var(--red)":"var(--muted)"}else $("lastDelta").textContent=t;$("rankIcon").src=rankIconUrl(name)}
function parseRecord(t){const m=t.match(/(\d+)\s*W\s*-\s*(\d+)\s*L\s*-\s*(\d+)\s*D(?:\s*\((\d+)%\s*WR\))?/i);if(m){$("wins").textContent=m[1];$("losses").textContent=m[2];$("draws").textContent=`${m[3]} D`;$("wr").textContent=`Win rate: ${m[4]!==undefined?m[4]+"%":"—"}`}else{$("wins").textContent="—";$("losses").textContent="—";$("draws").textContent="— D";$("wr").textContent=t||"No record data"}const r=t.match(/has\s+(gained|lost)\s+(\d+)\s+RR/i);if(r){const pos=r[1].toLowerCase()==="gained";$("rrToday").textContent=`${pos?"+":"−"}${r[2]} RR`;$("rrToday").className=`rrtoday ${pos?"positive":"negative"}`}else if(/neither gained nor lost RR/i.test(t)){$("rrToday").textContent="0 RR";$("rrToday").className="rrtoday neutral"}else{$("rrToday").textContent="RR unavailable";$("rrToday").className="rrtoday neutral"}}
async function refresh(){
  const base="https://valorant-rank-proxy.joshuawentworth23.workers.dev",name=enc(CONFIG.riotName),tag=enc(CONFIG.riotTag),region=enc(CONFIG.region);
  const a=`${base}/mmr/${name}/${tag}/${region}`;
  const b=`${base}/match_history/${name}/${tag}/${region}/${enc(CONFIG.platform)}?timezone=${enc(CONFIG.timezone)}`;
  let rankOK=false,historyOK=false,errors=[];
  try { const rank=await getText(a); parseRank(rank); rankOK=true; }
  catch(e) { $("rank").textContent="Rank unavailable"; $("rr").textContent="RR: —"; errors.push("Rank: "+String(e.message||e)); }
  try { const record=await getText(b); parseRecord(record); historyOK=true; }
  catch(e) { $("wins").textContent="—"; $("losses").textContent="—"; $("draws").textContent="— D"; $("wr").textContent="Match history unavailable"; $("rrToday").textContent="RR unavailable"; errors.push("History: "+String(e.message||e)); }
  $("updated").textContent=`Updated ${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
  if(rankOK && historyOK) setStatus("API connected");
  else if(rankOK) setStatus("Rank connected; history unavailable",false);
  else setStatus("Rank lookup failed",false);
  if(errors.length) $("lastDelta").textContent=errors.join(" | ").slice(0,100);
}
refresh();setInterval(refresh,Math.max(60,CONFIG.refreshSeconds)*1000);
</script>
</body></html>
